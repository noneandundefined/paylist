name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-client:
    name: Preview build (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: www-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paylist-client-pr-${{ github.event.pull_request.number }}
          path: www-client/dist
          retention-days: 14

      - name: Update PR with preview info
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const markerStart = '<!-- paylist-preview -->';
            const markerEnd = '<!-- /paylist-preview -->';
            const runId = process.env.RUN_ID;
            const prNumber = process.env.PR_NUMBER;
            const { owner, repo } = context.repo;
            const fullRepo = `${owner}/${repo}`;
            const runUrl = `https://github.com/${fullRepo}/actions/runs/${runId}`;

            const section = [
              markerStart,
              '## Paylist preview build',
              '',
              '> Auto-generated by CI on every push. Client artifact is kept for 14 days.',
              '',
              '| | |',
              '|---|---|',
              `| **PR** | #${prNumber} |`,
              `| **Workflow run** | [${runId}](${runUrl}) |`,
              `| **Artifact** | \`paylist-client-pr-${prNumber}\` |`,
              '',
              '### Download',
              '',
              '```bash',
              `gh run download ${runId} -R ${fullRepo} -n paylist-client-pr-${prNumber}`,
              '```',
              markerEnd,
            ].join('\n');

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(prNumber),
            });

            let body = pr.body ?? '';
            const startIdx = body.indexOf(markerStart);
            const endIdx = body.indexOf(markerEnd);

            if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
              body = body.slice(0, startIdx) + section + body.slice(endIdx + markerEnd.length);
            } else {
              body = body.trimEnd() + '\n\n' + section;
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: Number(prNumber),
              body,
            });
