name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you'd like to see in Paylist.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Subscriptions
        - Analytics
        - Account / settings
        - Notifications
        - Payments / plans
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve? What is your use case?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This affects the backend API
        - label: This affects the frontend UI
        - label: This requires new locales (en, ru, de, es)
        - label: This may be a breaking change
