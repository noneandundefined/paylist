version: '3.9'

services:
    db:
        image: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: paylist
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            retries: 5
    redis:
        image: redis:8
        command: redis-server --requirepass redispass --appendonly yes --appendfsync everysec
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 5

    # client:
    #     build:
    #         context: www-client
    #         dockerfile: Dockerfile
    #     ports:
    #         - '5173:5173'
    #     volumes:
    #         - ./www-client:/app
    #         - /app/node_modules
    #     depends_on:
    #         - db
    #         - redis

    http_server:
        restart: always
        build:
            context: http-server
            dockerfile: Dockerfile
        env_file: '.env.docker'
        volumes:
            - ./http-server:/app
        command: air
        ports:
            - '8080:8080'
        depends_on:
            - db
            - redis
volumes:
    redis_data:
